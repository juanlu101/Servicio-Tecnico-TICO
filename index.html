<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servicio Técnico TICO — Partes de avería</title>
<meta name="description" content="Actividad de diagnóstico de averías de componentes de ordenador. IES Julio Rodríguez.">
<meta name="robots" content="noarchive, nosnippet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --mesa:#2E322C;
  --mesa-alta:#3A3F37;
  --papel:#F2EDE0;
  --papel-n2:#EDE3B8;
  --papel-n3:#EFD8D2;
  --tinta:#2B2723;
  --tinta-flo:#6B655C;
  --rojo:#A8241C;
  --azul:#1F3A6E;
  --linea:#B9B09B;
  --grapa:#787D82;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--mesa);
  background-image:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.045), transparent 46%),
    radial-gradient(circle at 84% 78%, rgba(0,0,0,.32), transparent 52%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.055'/></svg>");
  color:var(--papel);
  font-family:"Courier Prime",ui-monospace,monospace;
  font-size:16px;
  line-height:1.5;
  -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
.envoltorio{max-width:1080px;margin:0 auto;padding:28px 20px 72px}

/* ---------- Cabecera del taller ---------- */
.cabecera{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding-bottom:18px;margin-bottom:34px;
  border-bottom:2px solid rgba(242,237,224,.22);
}
.cabecera__logo{width:112px;flex:none;border-radius:3px;filter:saturate(.82) contrast(1.02);box-shadow:0 3px 12px rgba(0,0,0,.45)}
.cabecera__texto{flex:1 1 260px;min-width:0}
.cabecera__rotulo{
  font-family:"Saira Condensed",sans-serif;font-weight:700;
  font-size:clamp(26px,5.4vw,44px);line-height:.98;letter-spacing:.02em;
  text-transform:uppercase;margin:0;
}
.cabecera__rotulo em{font-style:normal;color:#D9CFA8}
.cabecera__coletilla{
  font-family:"Saira Condensed",sans-serif;font-weight:500;
  font-size:13px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(242,237,224,.6);margin:8px 0 0;
}
.cabecera__firma{
  font-family:"Saira Condensed",sans-serif;font-size:12.5px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(242,237,224,.5);margin:4px 0 0;
}

/* ---------- Hoja de papel (base) ---------- */
.hoja{
  position:relative;
  background:var(--papel);
  color:var(--tinta);
  box-shadow:0 1px 0 rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.42);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23p)' opacity='.07'/></svg>");
}
.hoja::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(112deg,rgba(0,0,0,.05) 0%,transparent 22%,transparent 78%,rgba(0,0,0,.06) 100%);
}
.grapa{position:absolute;top:9px;left:12px;width:32px;height:17px;opacity:.9;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.28))}

/* ---------- Memorándum de instrucciones ---------- */
.memo{max-width:770px;margin:0 auto 54px;padding:34px 38px 30px;transform:rotate(-.35deg)}
.memo__cinta{
  position:absolute;top:-13px;right:34px;width:104px;height:26px;
  background:rgba(226,214,178,.72);border-left:1px dashed rgba(0,0,0,.14);border-right:1px dashed rgba(0,0,0,.14);
  transform:rotate(3.5deg);box-shadow:0 2px 5px rgba(0,0,0,.2);
}
.memo__enc{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;
  border-bottom:2px solid var(--tinta);padding-bottom:8px;margin-bottom:20px;
}
.memo__titulo{
  font-family:"Saira Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  font-size:22px;letter-spacing:.1em;margin:0;
}
.memo__ref{font-family:"Saira Condensed",sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta-flo)}
.memo p{margin:0 0 18px;font-size:15px;max-width:66ch}
.memo ol{margin:0;padding:0;list-style:none;counter-reset:instr}
.memo li{
  counter-increment:instr;position:relative;padding-left:38px;margin-bottom:12px;
  font-size:15px;max-width:70ch;
}
.memo li::before{
  content:counter(instr,decimal-leading-zero) ".";
  position:absolute;left:0;top:0;font-weight:700;color:var(--rojo);
  font-family:"Saira Condensed",sans-serif;font-size:16px;letter-spacing:.06em;
}
.memo__pie{
  margin-top:22px;padding-top:12px;border-top:1px dotted var(--linea);
  font-family:"Saira Condensed",sans-serif;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tinta-flo);
}

/* ---------- Rótulo de sección sobre la mesa ---------- */
.seccion{display:flex;align-items:center;gap:16px;margin:0 0 26px}
.seccion__txt{
  font-family:"Saira Condensed",sans-serif;font-weight:600;text-transform:uppercase;
  font-size:15px;letter-spacing:.3em;color:rgba(242,237,224,.82);white-space:nowrap;
}
.seccion__linea{height:1px;background:rgba(242,237,224,.24);flex:1}

/* ---------- Archivador: fichas de índice ---------- */
.archivador{
  display:grid;gap:26px;
  grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
  margin-bottom:38px;
}
.ficha{
  position:relative;display:flex;flex-direction:column;text-decoration:none;color:var(--tinta);
  padding:24px 20px 20px;
  transition:transform .16s ease,box-shadow .16s ease;
}
.ficha:nth-child(3n+1){transform:rotate(-.7deg)}
.ficha:nth-child(3n+2){transform:rotate(.45deg)}
.ficha:nth-child(3n+3){transform:rotate(-.2deg)}
.ficha:hover,.ficha:focus-visible{
  transform:translateY(-5px) rotate(0deg);
  box-shadow:0 1px 0 rgba(0,0,0,.5),0 22px 40px rgba(0,0,0,.5);
  z-index:2;
}
.ficha:focus-visible{outline:3px solid #E8C46A;outline-offset:3px}
.ficha--n2{background-color:var(--papel-n2)}
.ficha--n3{background-color:var(--papel-n3)}
.ficha__ot{
  font-family:"Saira Condensed",sans-serif;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--tinta-flo);
}
.ficha__titulo{
  font-family:"Saira Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  font-size:22px;line-height:1.06;letter-spacing:.01em;margin:6px 0 14px;
  padding-bottom:12px;border-bottom:1px solid var(--linea);
}
.ficha__dato{display:flex;gap:8px;font-size:13px;margin-bottom:5px;align-items:baseline}
.ficha__et{
  font-family:"Saira Condensed",sans-serif;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tinta-flo);flex:none;width:64px;
}
.ficha__val{flex:1;min-width:0}
.ficha__abrir{
  margin-top:auto;padding-top:16px;padding-top:11px;border-top:1px dotted var(--linea);
  font-family:"Saira Condensed",sans-serif;font-size:11.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--rojo);display:flex;justify-content:space-between;
}
.ficha__nivel{
  position:absolute;top:14px;right:-7px;
  font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;
  background:var(--tinta);color:var(--papel);padding:4px 9px 3px;
}
.ficha--n2 .ficha__nivel{background:#7A5B14}
.ficha--n3 .ficha__nivel{background:var(--rojo)}

.leyenda{
  font-family:"Saira Condensed",sans-serif;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(242,237,224,.5);
  display:flex;gap:22px;flex-wrap:wrap;align-items:center;
}
.leyenda span{display:flex;align-items:center;gap:8px}
.leyenda i{width:15px;height:15px;display:inline-block;border:1px solid rgba(0,0,0,.35)}

/* ---------- Ficha individual ---------- */
.parte{max-width:800px;margin:0 auto 34px;padding:38px 44px 44px 62px}
.parte--n2{background-color:var(--papel-n2)}
.parte--n3{background-color:var(--papel-n3)}
.taladro{position:absolute;left:22px;width:13px;height:13px;border-radius:50%;background:var(--mesa);box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.taladro--1{top:19%}.taladro--2{top:49%}.taladro--3{top:79%}

.parte__membrete{
  display:flex;align-items:center;gap:16px;
  padding-bottom:14px;border-bottom:3px double var(--tinta);
}
.parte__membrete img{width:66px;flex:none;mix-blend-mode:multiply;opacity:.92}
.parte__empresa{font-family:"Saira Condensed",sans-serif;font-weight:700;text-transform:uppercase;font-size:19px;letter-spacing:.08em;line-height:1;margin:0}
.parte__empresa small{display:block;font-weight:500;font-size:10.5px;letter-spacing:.22em;color:var(--tinta-flo);margin-top:5px}
.parte__ot{margin-left:auto;text-align:right;font-family:"Saira Condensed",sans-serif}
.parte__ot b{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta-flo);font-weight:500}
.parte__ot span{font-size:25px;font-weight:700;letter-spacing:.03em}

.parte__tit{
  font-family:"Saira Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  font-size:clamp(27px,5.6vw,40px);line-height:1;letter-spacing:.005em;
  margin:24px 0 26px;
}
.parte__tit small{
  display:block;font-size:12px;font-weight:500;letter-spacing:.26em;
  color:var(--tinta-flo);margin-bottom:9px;
}

.casillas{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));border:1.5px solid var(--tinta);margin-bottom:30px}
.casilla{padding:9px 13px 11px;border-right:1px solid var(--linea)}
.casilla:last-child{border-right:none}
.casilla b{
  display:block;font-family:"Saira Condensed",sans-serif;font-weight:600;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta-flo);margin-bottom:4px;
}
.casilla span{font-size:14px;line-height:1.32;display:block}

.bloque{margin-bottom:30px}
.bloque__et{
  font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:11px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--tinta-flo);
  display:flex;align-items:center;gap:12px;margin-bottom:12px;
}
.bloque__et::after{content:"";height:1px;background:var(--linea);flex:1}

.relato{
  position:relative;border:1.5px solid var(--tinta);padding:26px 28px 30px;
  background:rgba(255,255,255,.28);
}
.relato p{
  font-family:"Caveat",cursive;font-size:23px;line-height:1.5;color:var(--azul);
  margin:0;transform:rotate(-.25deg);
}
.relato__firma{
  font-family:"Caveat",cursive;font-size:19px;color:var(--azul);
  text-align:right;margin-top:16px;opacity:.85;
}

.reservado{border:1.5px dashed var(--linea);padding:20px 22px 24px;position:relative;overflow:hidden}
.reservado__aviso{
  font-family:"Saira Condensed",sans-serif;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tinta-flo);margin:0 0 18px;
}
.campo{margin-bottom:17px}
.campo b{
  display:block;font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:10.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--tinta-flo);margin-bottom:7px;
}
.campo i{display:block;height:1px;background:var(--linea);margin-bottom:13px}
.campo i:last-child{margin-bottom:0}


/* ---------- Informe: formulario sobre la hoja ---------- */
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.informe{border:1.5px dashed var(--linea);padding:22px 24px 26px;position:relative;overflow:hidden}
.informe__aviso{
  font-family:"Saira Condensed",sans-serif;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tinta-flo);margin:0 0 20px;
}
.identidad{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:18px;margin-bottom:26px}
.idcampo b,.campo b{
  display:block;font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:10.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--tinta-flo);margin-bottom:6px;
}
.idcampo input{
  width:100%;border:none;border-bottom:1.5px solid var(--tinta);background:transparent;
  font-family:"Courier Prime",monospace;font-size:15px;color:var(--tinta);
  padding:2px 2px 4px;outline:none;border-radius:0;
}
.idcampo input:focus{background:rgba(255,255,255,.55);outline:2px solid var(--azul);outline-offset:3px}
.idcampo--fecha span{
  display:block;font-family:"Courier Prime",monospace;font-size:15px;
  padding:2px 2px 4px;border-bottom:1.5px solid var(--linea);color:var(--tinta-flo);
}
.campo{margin-bottom:22px}
.campo__pista{
  display:block;font-family:"Saira Condensed",sans-serif;font-weight:500;font-size:11px;
  letter-spacing:.06em;text-transform:none;color:var(--tinta-flo);margin-top:2px;
}
.rellenar{
  display:block;width:100%;border:none;background:transparent;resize:none;overflow:hidden;
  font-family:"Courier Prime",monospace;font-size:15px;line-height:26px;color:var(--tinta);
  padding:0;margin:0;outline:none;min-height:78px;border-radius:0;
  background-image:repeating-linear-gradient(transparent 0 25px,var(--linea) 25px 26px);
}
.rellenar::placeholder{color:rgba(43,39,35,.26);font-style:italic}
.rellenar:focus{outline:2px solid var(--azul);outline-offset:4px;background-color:rgba(255,255,255,.45)}

.acciones{
  max-width:800px;margin:20px auto 24px;display:flex;gap:14px;align-items:center;
  flex-wrap:wrap;justify-content:space-between;
}
.estado{
  font-family:"Saira Condensed",sans-serif;font-size:12px;letter-spacing:.15em;
  text-transform:uppercase;color:rgba(242,237,224,.48);
}
.estado--vivo{color:#CFE0B8}
.botonera{display:flex;gap:10px;flex-wrap:wrap}
.boton{
  font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:12.5px;
  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
  padding:11px 18px 10px;border:1px solid rgba(242,237,224,.28);
  background:var(--mesa-alta);color:rgba(242,237,224,.85);
  transition:background .15s ease,color .15s ease;
}
.boton:hover{background:var(--papel);color:var(--tinta);border-color:var(--papel)}
.boton:focus-visible{outline:3px solid #E8C46A;outline-offset:2px}
.boton--sello{background:var(--rojo);border-color:var(--rojo);color:#F7F0E2}
.boton--sello:hover{background:#8C1B15;border-color:#8C1B15;color:#F7F0E2}
.ficha__estado{
  font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;margin-left:10px;color:var(--azul);
}
.ficha__estado--cerrado{color:var(--rojo)}

/* ---------- Sellos de goma ---------- */
.sello{
  position:absolute;font-family:"Saira Condensed",sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;padding:6px 13px 5px;
  border:3px solid currentColor;line-height:1;opacity:.62;
  mix-blend-mode:multiply;filter:url(#tinta-rota);pointer-events:none;
}
.sello--urgente{color:var(--rojo);font-size:23px;top:152px;right:30px;transform:rotate(-11deg)}
.sello--pendiente{color:var(--tinta-flo);font-size:24px;right:24px;bottom:18px;transform:rotate(-7deg);opacity:.38}
.sello--curso{color:var(--azul);opacity:.42}
.sello--cerrado{color:var(--rojo);opacity:.5}
.sello--recibido{
  color:var(--azul);font-size:12px;border-width:2px;letter-spacing:.16em;
  left:58px;bottom:20px;transform:rotate(-4deg);opacity:.5;
}

/* ---------- Navegación entre partes ---------- */
.pestanas{max-width:800px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.pest{
  font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:12.5px;
  letter-spacing:.16em;text-transform:uppercase;text-decoration:none;
  color:rgba(242,237,224,.85);background:var(--mesa-alta);
  border:1px solid rgba(242,237,224,.28);padding:11px 17px 10px;
  transition:background .15s ease,color .15s ease;
}
.pest:hover,.pest:focus-visible{background:var(--papel);color:var(--tinta);border-color:var(--papel)}
.pest:focus-visible{outline:3px solid #E8C46A;outline-offset:2px}
.pest--inerte{opacity:.3;pointer-events:none}

.pie{
  margin-top:56px;padding-top:16px;border-top:1px solid rgba(242,237,224,.16);
  font-family:"Saira Condensed",sans-serif;font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(242,237,224,.42);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
}

.aviso{
  background:var(--papel);color:var(--tinta);padding:24px 26px;max-width:620px;
  margin:60px auto;font-size:15px;border-left:6px solid var(--rojo);
}
.aviso b{font-family:"Saira Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:8px}

@media (max-width:620px){
  .envoltorio{padding:18px 13px 54px}
  .memo{padding:26px 20px 24px;transform:none}
  .parte{padding:26px 20px 32px 40px}
  .taladro{left:13px;width:11px;height:11px}
  .ficha{transform:none !important}
  .sello--urgente{position:static;display:block;width:-moz-max-content;width:max-content;
    margin:-12px 0 20px auto;font-size:16px;transform:rotate(-5deg)}
  .sello--recibido{left:38px;bottom:14px}
  .casilla{border-right:none;border-bottom:1px solid var(--linea)}
  .casilla:last-child{border-bottom:none}
  .pest{flex:1 1 100%;text-align:center}
  .sello--pendiente{font-size:17px;right:14px;bottom:10px}
  .identidad{grid-template-columns:1fr;gap:14px}
  .informe{padding:18px 15px 22px}
  .acciones{flex-direction:column;align-items:stretch}
  .botonera{flex-direction:column}
  .boton{width:100%;text-align:center}
  .relato{padding:20px 18px 22px}
  .relato p{font-size:21px}
  .parte__membrete{flex-wrap:wrap}
  .parte__ot{margin-left:0;text-align:left}
}
@media (prefers-reduced-motion:no-preference){
  .entra{animation:posarse .5s cubic-bezier(.2,.8,.3,1) both}
  @keyframes posarse{from{opacity:0;transform:translateY(-14px) rotate(1.2deg)}to{opacity:1;transform:none}}
}
@media print{
  body *{visibility:hidden}
  body::after{
    visibility:visible;content:"Servicio Técnico TICO — documento no imprimible. Consulta el parte en pantalla.";
    position:fixed;inset:0;display:block;padding:40px;font-size:18px;color:#000;
  }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="tinta-rota"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="r"/><feDisplacementMap in="SourceGraphic" in2="r" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter></svg>

<div class="envoltorio">
  <header class="cabecera">
    <img class="cabecera__logo" src="logo-ies.jpg" alt="Escudo del IES Julio Rodríguez">
    <div class="cabecera__texto">
      <h1 class="cabecera__rotulo">Servicio Técnico <em>TICO</em></h1>
      <p class="cabecera__coletilla">Reparación de equipos informáticos · Taller de diagnóstico</p>
      <p class="cabecera__firma">IES Julio Rodríguez · Profesor Juan Luis Torralbo Muñoz</p>
    </div>
  </header>
  <main id="taller" tabindex="-1"></main>
  <footer class="pie">
    <span>Servicio Técnico TICO · Partes de avería</span>
    <span>Uso didáctico — IES Julio Rodríguez</span>
  </footer>
</div>

  <div class="aviso"><b>Falta activar JavaScript</b>Los partes de avería se cargan con JavaScript. Actívalo en el navegador y vuelve a cargar la página.</div>
</noscript>

<script>

    h += '<div class="acciones"><span class="estado" id="estado">Se guarda solo en este navegador</span>' +
      '<span class="botonera">' +
        '<button class="boton" type="button" id="borrar">Vaciar informe</button>' +
        '<button class="boton boton--sello" type="button" id="descargar">Descargar informe (PDF)</button>' +
      '</span></div>';

    var ant = p.n > 1 ? '<a class="pest" href="#/parte/' + (p.n - 1) + '">&#10229; Parte ' + (p.n - 1) + '</a>'
                      : '<span class="pest pest--inerte">&#10229; Parte anterior</span>';
    var sig = p.n < partes.length ? '<a class="pest" href="#/parte/' + (p.n + 1) + '">Parte ' + (p.n + 1) + ' &#10230;</a>'
                                  : '<span class="pest pest--inerte">Parte siguiente &#10230;</span>';
    h += '<nav class="pestanas">' + ant + '<a class="pest" href="#/">Volver al archivador</a>' + sig + '</nav>';
    return h;
  }

  /* --- Vida del formulario --- */
  var avisoTimer = null;
  function avisar(txt, vivo){
    var e = document.getElementById("estado");
    if (!e) return;
    e.textContent = txt;
    e.className = "estado" + (vivo ? " estado--vivo" : "");
    clearTimeout(avisoTimer);
    avisoTimer = setTimeout(function(){
      if (e.isConnected) { e.textContent = "Se guarda solo en este navegador"; e.className = "estado"; }
    }, 2600);
  }
  function crecer(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

  function activar(p){
    var d = datosParte(p.n);
    var areas = [].slice.call(document.querySelectorAll(".rellenar"));
    areas.forEach(function(ta){
      ta.value = d[ta.dataset.k] || "";
      crecer(ta);
    });

    var guardaTimer = null;
    function recoger(){
      var o = {};
      areas.forEach(function(ta){ o[ta.dataset.k] = ta.value; });
      return o;
    }
    function marcar(){
      var m = document.getElementById("marca"), n = hechos(recoger());
      if (!m) return;
      var e = n === 0 ? ["pendiente","Pendiente"] : (n === areas.length ? ["cerrado","Cerrado"] : ["curso","En curso"]);
      m.className = "sello sello--pendiente sello--" + e[0];
      m.textContent = e[1];
    }
    function guardar(){
      var ok = escribir("tico:parte:" + p.n, recoger());
      avisar(ok ? "Guardado" : "No se ha podido guardar", ok);
      marcar();
    }
    areas.forEach(function(ta){
      ta.addEventListener("input", function(){
        crecer(ta);
        clearTimeout(guardaTimer);
        guardaTimer = setTimeout(guardar, 600);
      });
    });

    ["nombre","grupo"].forEach(function(id){
      var el = document.getElementById(id);
      el.addEventListener("input", function(){
        var t = tecnico(); t[id] = el.value; escribir("tico:tecnico", t);
      });
    });

    document.getElementById("borrar").addEventListener("click", function(){
      if (!confirm("¿Vaciar todo lo escrito en este parte? No se puede deshacer.")) return;
      areas.forEach(function(ta){ ta.value = ""; crecer(ta); });
      escribir("tico:parte:" + p.n, {});
      marcar();
      avisar("Informe vaciado");
      areas[0].focus();
    });

    document.getElementById("descargar").addEventListener("click", function(){
      var nom = document.getElementById("nombre").value.trim();
      if (!nom) {
        avisar("Falta el nombre del equipo técnico");
        document.getElementById("nombre").focus();
        return;
      }
      var datos = recoger();
      if (hechos(datos) < areas.length &&
          !confirm("Hay apartados sin rellenar. ¿Descargar el informe igualmente?")) return;
      guardar();
      generarPDF(p, nom, document.getElementById("grupo").value.trim(), datos);
    });
  }

  /* --- Informe en PDF --- */
  var logoCache = null;
  function pillarLogo(){
    if (logoCache) return Promise.resolve(logoCache);
    return fetch("logo-ies.jpg").then(function(r){ return r.blob(); }).then(function(b){
      return new Promise(function(res){
        var fr = new FileReader();
        fr.onload = function(){ logoCache = fr.result; res(logoCache); };
        fr.onerror = function(){ res(null); };
        fr.readAsDataURL(b);
      });
    }).catch(function(){ return null; });
  }

  function generarPDF(p, nom, grupo, datos){
    var J = window.jspdf && window.jspdf.jsPDF;
    if (!J) { alert("No se ha podido cargar el generador de PDF. Revisa tu conexión y recarga la página."); return; }
    avisar("Generando el PDF…", true);

    pillarLogo().then(function(logo){
      var doc = new J({unit:"mm", format:"a4"});
      var M = 18, ANCHO = 210 - M * 2, y = 0, pagina = 0;

      function pie(){
        doc.setFont("helvetica","normal").setFontSize(7.5).setTextColor(130,130,130);
        doc.text("IES Julio Rodríguez · Servicio Técnico TICO · Profesor Juan Luis Torralbo Muñoz", M, 288);
        doc.text(String(pagina), 210 - M, 288, {align:"right"});
      }
      function cabecera(){
        pagina++;
        if (pagina > 1) doc.addPage();
        if (logo) { try { doc.addImage(logo, "JPEG", M, 12, 24, 13.1); } catch (e) {} }
        doc.setTextColor(30,28,25).setFont("helvetica","bold").setFontSize(12);
        doc.text("SERVICIO TÉCNICO TICO", M + 28, 18);
        doc.setFont("helvetica","normal").setFontSize(8).setTextColor(120,118,112);
        doc.text("Informe técnico · Taller de diagnóstico y reparación", M + 28, 22.6);
        doc.setFont("helvetica","bold").setFontSize(11).setTextColor(30,28,25);
        doc.text(ot(p.n), 210 - M, 18, {align:"right"});
        doc.setDrawColor(30,28,25).setLineWidth(0.5).line(M, 28, 210 - M, 28);
        y = 37;
        pie();
      }
      function sitio(alto){ if (y + alto > 280) cabecera(); }

      function etiqueta(txt){
        sitio(16);
        doc.setFont("helvetica","bold").setFontSize(8.5).setTextColor(120,118,112);
        doc.text(txt.toUpperCase(), M, y);
        doc.setDrawColor(190,186,175).setLineWidth(0.2).line(M, y + 1.8, 210 - M, y + 1.8);
        y += 7;
      }
      function parrafo(txt, italica, gris){
        doc.setFont("helvetica", italica ? "italic" : "normal").setFontSize(10)
           .setTextColor(gris ? 90 : 30, gris ? 88 : 28, gris ? 84 : 25);
        var lineas = doc.splitTextToSize(txt, ANCHO);
        for (var i = 0; i < lineas.length; i++) {
          sitio(6);
          doc.text(lineas[i], M, y);
          y += 5.2;
        }
        y += 4;
      }

      cabecera();

      doc.setFont("helvetica","bold").setFontSize(16).setTextColor(30,28,25);
      doc.text("Parte n.º " + p.n + " — " + p.titulo, M, y); y += 8;
      doc.setFont("helvetica","normal").setFontSize(9).setTextColor(90,88,84);
      doc.text("Nivel " + p.nivel + "  ·  Cliente: " + p.cliente, M, y); y += 4.6;
      doc.text("Equipo: " + p.equipo, M, y); y += 4.6;
      doc.text("Equipo técnico: " + nom + (grupo ? "  ·  Grupo: " + grupo : "") + "  ·  Fecha: " + hoy(), M, y);
      y += 10;

      etiqueta("Descripción facilitada por el cliente");
      parrafo("«" + p.relato + "»  — " + p.firma, true, true);
      y += 2;

      CAMPOS.forEach(function(c){
        etiqueta(c.t);
        var v = (datos[c.k] || "").trim();
        parrafo(v || "(sin cumplimentar)", !v, !v);
      });

      var limpio = function(x){
        return x.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "-")
                .replace(/^-|-$/g, "").toLowerCase();
      };
      doc.save("OT-" + ("00" + p.n).slice(-3) + "_" + limpio(p.titulo) + "_" + limpio(nom) + ".pdf");
      avisar("Informe descargado", true);
    });
  }

  function pintar(){
    var m = /^#\/parte\/(\d+)$/.exec(location.hash);
    var p = m ? partes[parseInt(m[1], 10) - 1] : null;
    if (m && !p) {
      taller.innerHTML = '<div class="aviso"><b>Ese parte no existe</b>Solo hay ' + partes.length +
        ' partes de avería. <a href="#/">Volver al archivador</a>.</div>';
    } else {
      taller.innerHTML = p ? ficha(p) : indice();
    }
    document.title = (p ? "Parte " + p.n + " — " + p.titulo + " · " : "") + "Servicio Técnico TICO";
    window.scrollTo(0, 0);
    if (p) { activar(p); taller.focus({preventScroll:true}); }
  }

  window.addEventListener("hashchange", pintar);
  window.addEventListener("resize", function(){
    [].forEach.call(document.querySelectorAll(".rellenar"), crecer);
  });
  pintar();

  /* --- Freno al copiar y pegar (el informe del alumno queda libre) --- */
  function esCampo(e){
    var t = e.target;
    return t && t.closest && t.closest("input,textarea");
  }
  ["copy","cut","contextmenu","dragstart","selectstart"].forEach(function(ev){
    document.addEventListener(ev, function(e){
      if (esCampo(e)) return;
      e.preventDefault();
      return false;
    }, {capture:true});
  });
  document.addEventListener("paste", function(e){
    if (PEGAR_PERMITIDO && esCampo(e)) return;
    e.preventDefault();
    if (esCampo(e)) avisar("Pegar está desactivado: escribe tu respuesta");
  }, {capture:true});
  document.addEventListener("keydown", function(e){
    var k = (e.key || "").toLowerCase(), campo = esCampo(e);
    if (e.key === "F12") return e.preventDefault();
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && ["i","j","c"].indexOf(k) > -1) return e.preventDefault();
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey) {
      if (["s","u","p"].indexOf(k) > -1) return e.preventDefault();
      if (!campo && ["c","x","a"].indexOf(k) > -1) return e.preventDefault();
      if (campo && !PEGAR_PERMITIDO && k === "v") return e.preventDefault();
    }
  }, {capture:true});
})();
</script>
